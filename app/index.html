<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Neon Boulevard Cover Studio — turn your photos into GTA-style poster cover art, offline in the browser.">
<title>Neon Boulevard Cover Studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<noscript><p class="noscript">Neon Boulevard needs JavaScript: the cover is drawn on a canvas in your browser.</p></noscript>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <h1>Neon Boulevard</h1>
    <p class="tagline">Turn your photos into GTA-style poster cover art. Your photos never leave this machine.</p>

    <fieldset>
      <legend>Photos</legend>
      <label>Upload photos <input id="upload" type="file" accept="image/*" multiple></label>
      <div class="samples" id="samples" aria-label="Sample photos"></div>
      <button id="fillAll" type="button">Fill every panel with the selected photo</button>
      <p class="hint">Click a panel in the preview to select it, then drag to move its photo. Scroll over the preview to zoom it.</p>
    </fieldset>

    <fieldset>
      <legend>Layout</legend>
      <div class="choices" id="layouts"></div>
    </fieldset>

    <fieldset>
      <legend>Colour grade</legend>
      <div class="choices" id="grades"></div>
    </fieldset>

    <fieldset>
      <legend>Post size</legend>
      <div class="choices" id="sizes"></div>
    </fieldset>

    <fieldset>
      <legend>Lettering</legend>
      <label>Title <input id="title" type="text" maxlength="24" value="NEON SHORE"></label>
      <label>Subtitle <input id="subtitle" type="text" maxlength="48" value="one night in the city"></label>
      <label>Badge <input id="badge" type="text" maxlength="24" value="NEON BOULEVARD"></label>
      <label>Heat <select id="stars">
        <option value="0">no stars</option>
        <option value="3">★★★</option>
        <option value="4">★★★★</option>
        <option value="5" selected>★★★★★</option>
      </select></label>
    </fieldset>

    <fieldset>
      <legend>Finish</legend>
      <label class="check"><input id="grain" type="checkbox" checked> Film grain</label>
      <label class="check"><input id="vignette" type="checkbox" checked> Vignette</label>
      <label class="check"><input id="frame" type="checkbox" checked> White poster frame</label>
    </fieldset>

    <fieldset>
      <legend>Selected panel</legend>
      <label>Zoom <input id="zoom" type="range" min="1" max="2.5" step="0.05" value="1"></label>
      <p class="hint" id="panelInfo">Panel 1 of 9</p>
    </fieldset>

    <div class="actions">
      <button id="undo" type="button">Undo</button>
      <button id="redo" type="button">Redo</button>
      <button id="export" type="button" class="primary">Export PNG</button>
      <button id="exportAll" type="button">Export all sizes</button>
    </div>
    <p id="status" role="status"></p>
  </section>
  <section class="stage" aria-label="Cover preview">
    <canvas id="cover" width="1080" height="1080" aria-label="The cover preview"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
